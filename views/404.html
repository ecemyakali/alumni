<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Alumni Tracking System</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 960px;
      margin: 30px auto;
      padding: 0 20px;
      color: #1e293b;
      background-color: #f8fafc;
      line-height: 1.6;
    }
    .top-nav {
      display: flex;
      gap: 15px;
      padding: 12px 20px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 24px;
      align-items: center;
      flex-wrap: wrap;
    }
    .top-nav a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
    }
    .top-nav a:hover { text-decoration: underline; }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .badge {
      display: inline-block;
      font-size: 48px;
      font-weight: 800;
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      padding: 4px 24px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #64748b; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: #2563eb;
      color: #ffffff;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="/main">🏠 Home</a>
    <a href="/users">👥 Alumni Directory</a>
    <a href="/job-postings">💼 Careers</a>
    <a href="/announcements">📢 Announcements</a>
    <a href="/api/swagger">📑 API Docs</a>
  </nav>

  <main class="card">
    <div class="badge">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or may have been moved.</p>
    <a href="/main" class="btn">← Return to Home</a>
  </main>
</body>
</html>
